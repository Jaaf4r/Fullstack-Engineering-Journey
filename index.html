<!DOCTYPE html>
<html lang="en">

<head>
	<title>Vinland Café</title>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<link rel="stylesheet" href="styles.css" />
</head>

<body>
	<main class="card">
		<header class="header">
			<h1>Vinland Café! ☕</h1>
			<p class="status">Open today</p>
		</header>
		<section>
			<h2 id="one">Hot Drinks</h2>
			<ul>
				<li>Espresso</li>
				<li>Macchiato</li>
				<li>Chocolate coffee</li>
			</ul>
		</section>
		<section>
			<h2 id="two">Cold Drinks</h2>
			<ul>
				<li>Iced Coffee</li>
				<li>Iced Tea</li>
				<li>Matcha Tea</li>
			</ul>
		</section>
		<section>
			<h2 id="three">Desserts</h2>
			<ul>
				<li>Chocolate Cake</li>
				<li>Pecan Cheesecake</li>
				<li>Amaretto Cheesecake</li>
			</ul>
		</section>
		<footer>
			<a href="https://www.kiriha.jp/cafe/">welcome to Vinland Café</a>
			<button id="status-button">Check café status</button>
			<p id="click-count">Status checks: 0</p>
			<p class="cafe">© 2020 - Vinland Café & Inn</p>
		</footer>
	</main>
	<script src="script.js"></script>
</body>

</html>
